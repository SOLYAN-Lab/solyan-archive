<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOLYAN Archive — 生化危机0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#dceef7;--bg-2:#b9d9e8;--bg-3:#edf5f9;
  --text-main:#17384d;--text-soft:#6b899d;--text-faint:#8ca8b8;
  --glass-border:rgba(255,255,255,.78);--glass-bg:rgba(255,255,255,.28);
  --glass-shadow:rgba(80,145,177,.16);
  --accent:#78cce9;--accent-strong:#4eb9df;
  --status-complete:#65c89a;--status-progress:#e5b96c;--status-error:#e58b92;
  --display:"Space Grotesk","Noto Sans SC",sans-serif;
  --body:Inter,"Noto Sans SC","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",monospace;
  --transition:260ms cubic-bezier(.2,.75,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%}
body{
  min-height:100vh;overflow-x:hidden;color:var(--text-main);font-family:var(--body);
  background:
    radial-gradient(ellipse at 8% 8%,rgba(255,255,255,.68) 0%,rgba(255,255,255,0) 32%),
    radial-gradient(ellipse at 92% 12%,rgba(255,255,255,.48) 0%,rgba(255,255,255,0) 30%),
    radial-gradient(ellipse at 70% 92%,rgba(120,190,218,.20) 0%,rgba(120,204,233,0) 36%),
    linear-gradient(135deg,var(--bg-1),var(--bg-2) 48%,var(--bg-3));
}
button{font:inherit;border:0}
.scene{position:relative;min-height:100vh;isolation:isolate}
.scene:before,.scene:after{
  content:"";position:fixed;pointer-events:none;z-index:-4;border-radius:50%;filter:blur(30px)
}
.scene:before{width:62vw;height:62vw;left:-28vw;bottom:-38vw;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,0))}
.scene:after{width:52vw;height:52vw;right:-25vw;top:-25vw;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(120,204,233,.08),transparent 70%)}
.light-field{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
.light-ribbon{position:absolute;width:70vw;height:150vh;top:-35vh;left:-15vw;border-radius:50%;background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.02) 26%,rgba(255,255,255,.42) 45%,rgba(152,222,245,.12) 53%,transparent 72%);filter:blur(28px);opacity:.65;transform:rotate(20deg);animation:ribbon 32s ease-in-out infinite alternate}
.light-ribbon.two{width:48vw;left:48vw;top:-22vh;opacity:.38;filter:blur(36px);transform:rotate(-24deg);animation-delay:-14s;animation-duration:39s}
.light-ribbon.three{width:35vw;height:100vh;left:30vw;top:35vh;opacity:.24;filter:blur(45px);transform:rotate(65deg);animation-delay:-22s;animation-duration:44s}
@keyframes ribbon{from{transform:translate3d(-3%,0,0) rotate(20deg) scale(1)}to{transform:translate3d(9%,-2%,0) rotate(24deg) scale(1.08)}}
.glass{
  border:1px solid var(--glass-border);
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.18));
  box-shadow:0 14px 35px var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.72),inset 0 -1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(22px) saturate(108%);-webkit-backdrop-filter:blur(22px) saturate(108%);
}
.app-shell{position:relative;z-index:2;display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;width:100%;min-height:100vh;padding:24px}
.sidebar{min-height:calc(100vh - 48px);padding:20px 14px;border-radius:26px;display:flex;flex-direction:column}
/* game detail directory header */
.game-logo-slot{width:100%;aspect-ratio:1/1;max-width:132px;margin:2px auto 28px;display:grid;place-items:center;border:1px dashed rgba(78,185,223,.42);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(120,204,233,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 10px 24px rgba(75,157,193,.06);overflow:hidden}

.game-logo-slot img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;padding:10px;box-sizing:border-box}
.game-logo-slot .game-logo-fallback{width:100%;height:100%;place-items:center;color:var(--accent-strong);font:700 22px var(--mono);letter-spacing:.08em}
.game-logo-slot span{color:var(--text-faint);font:8px var(--mono);letter-spacing:.12em;opacity:.78}
.sidebar-divider{height:1px;margin:0 7px 20px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
.nav-group{margin-bottom:22px}.nav-group-label{margin:0 7px 10px;padding:0 3px 9px;color:var(--accent-strong);border-bottom:1px solid rgba(78,185,223,.30);font:600 9.3px var(--mono);letter-spacing:.10em}
.nav-item{position:relative;width:100%;min-height:44px;padding:0 9px;display:flex;align-items:center;gap:12px;border:1px solid transparent;border-radius:13px;color:var(--text-soft);background:transparent;cursor:pointer;text-align:left;transition:transform 180ms cubic-bezier(.2,.75,.25,1),background 180ms ease,border-color 180ms ease,box-shadow 180ms ease,color 180ms ease}
.nav-item:hover{color:var(--text-main);background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.36);transform:translateY(-1px);box-shadow:0 8px 18px rgba(75,157,193,.06)}
.nav-item:active{transform:translateY(1px) scale(.975);background:rgba(255,255,255,.40);border-color:rgba(255,255,255,.68);box-shadow:inset 0 2px 6px rgba(70,140,170,.11),0 2px 8px rgba(75,157,193,.06);transition-duration:80ms}
.nav-item.active{color:var(--text-main);border-color:rgba(255,255,255,.68);background:linear-gradient(135deg,rgba(255,255,255,.50),rgba(255,255,255,.16));box-shadow:0 8px 20px rgba(75,157,193,.08),inset 0 1px 0 rgba(255,255,255,.72)}
.nav-item.active:before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent-strong);box-shadow:0 0 10px rgba(78,185,223,.42)}
.interactive{position:relative;overflow:hidden;transition:transform 180ms cubic-bezier(.2,.75,.25,1),box-shadow 180ms ease,background 180ms ease,border-color 180ms ease,color 180ms ease}
.interactive:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.98);box-shadow:0 14px 30px rgba(75,157,193,.15),inset 0 1px 0 rgba(255,255,255,.94),inset 0 -1px 0 rgba(255,255,255,.18)}
.interactive:active,.interactive.is-pressed{transform:perspective(700px) rotateX(2deg) translateY(2px) scale(.985)}
.interactive::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.7) 48%,transparent 76%);transform:translateX(-135%);opacity:0}
.interactive.is-sweeping::after{animation:sweepLight 720ms cubic-bezier(.2,.65,.25,1)}
@keyframes sweepLight{0%{transform:translateX(-135%);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(135%);opacity:0}}
.nav-item.active{color:var(--accent-strong);}
.nav-item.active .nav-label{color:var(--accent-strong);}
.nav-item.active .nav-line-icon{color:var(--accent-strong);}
.nav-item.active .nav-count,.nav-item.active .nav-current{color:var(--accent-strong);}

.nav-line-icon{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;color:currentColor;opacity:.76;transition:transform 180ms ease,opacity 180ms ease,color 180ms ease}.nav-line-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.nav-item:hover .nav-line-icon{opacity:.95;transform:translateY(-.5px)}.nav-item:active .nav-line-icon{transform:translateY(1px) scale(.94)}.nav-item.active .nav-line-icon{opacity:1;color:var(--accent-strong)}
.nav-label{flex:1;font:600 11.1px var(--display);letter-spacing:.01em}.nav-count{margin-left:auto;color:var(--text-faint);font:600 10px var(--mono);min-width:18px;text-align:right}.nav-current{margin-left:auto;width:20px;height:20px;display:grid;place-items:center;color:var(--status-complete);opacity:.82}.nav-current svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.nav-current circle{fill:currentColor;fill-opacity:.18;stroke:none}
.sidebar-bottom{margin-top:auto;padding:18px 8px 2px}.system-status{display:flex;align-items:center;gap:8px;color:var(--text-soft);font:8px var(--mono);letter-spacing:.04em}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--status-complete);box-shadow:0 0 8px rgba(101,200,154,.8),0 0 15px rgba(101,200,154,.3)}
.sidebar-version{margin-top:10px;color:var(--text-faint);font:8px var(--mono);letter-spacing:.06em}

.main-area{min-width:0;min-height:calc(100vh - 48px);display:flex;flex-direction:column;gap:20px}
.topbar{min-height:72px;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-radius:22px}
.breadcrumb{display:flex;align-items:center;gap:9px;color:var(--text-faint);font:9.8px var(--mono);letter-spacing:.07em;text-transform:uppercase;flex-wrap:wrap}.breadcrumb a{color:inherit;text-decoration:none;transition:color .18s ease}.breadcrumb a:hover{color:var(--accent-strong)}.breadcrumb .current{color:var(--accent-strong);font-weight:700;text-shadow:0 0 12px rgba(78,185,223,.18)}
.breadcrumb strong{color:var(--accent-strong);font-weight:600}.topbar-actions{display:flex;gap:9px}
.topbar-button{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--glass-border);border-radius:12px;color:var(--text-main);background:rgba(255,255,255,.25);cursor:pointer}
.topbar-button.language{width:auto;padding:0 13px;font:700 10px var(--display);letter-spacing:.08em}

.page-content{display:flex;flex-direction:column;gap:20px;padding-bottom:80px}
.hero{
  position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(250px,.72fr) minmax(0,1.28fr);
  min-height:390px;border-radius:28px;padding:28px;gap:30px
}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 82% 18%,rgba(120,204,233,.18),transparent 34%),linear-gradient(135deg,rgba(255,255,255,.10),transparent 55%)}
.hero-art{position:relative;z-index:1;min-height:330px;border:1px solid rgba(255,255,255,.62);border-radius:22px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(120,204,233,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.hero-art:before{content:"";width:72%;height:86%;border:1px solid rgba(255,255,255,.45);border-radius:20px;transform:rotate(-3deg);box-shadow:0 18px 40px rgba(75,157,193,.10)}
.hero-art-label{position:absolute;bottom:18px;left:20px;color:var(--text-faint);font:8px var(--mono);letter-spacing:.12em}
.hero-copy{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center}
.hero-kicker{color:var(--accent-strong);font:600 10px var(--mono);letter-spacing:.15em;text-transform:uppercase}
.hero h1{margin-top:18px;font:600 clamp(34px,4vw,60px)/.98 var(--display);letter-spacing:-.055em}
.hero h2{margin-top:12px;color:var(--text-soft);font:500 18px var(--display)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;color:var(--text-soft);font:10px var(--mono)}
.hero-meta span:not(:last-child):after{content:"·";margin-left:8px;color:var(--text-faint)}
.state-pill{align-self:flex-start;margin-top:20px;padding:6px 10px;border:1px solid rgba(112,190,151,.62);border-radius:999px;color:var(--status-complete);background:rgba(76,166,119,.16);font:600 9px var(--mono);letter-spacing:.06em}
.personal-record{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:25px;padding-top:17px;border-top:1px solid rgba(255,255,255,.45)}
.record-item{min-width:0}.record-item small{display:block;color:var(--text-faint);font:8px var(--mono);letter-spacing:.08em}.record-item strong{display:block;margin-top:7px;font:600 18px var(--display);letter-spacing:-.025em}

.info-nav{display:block}
.info-card{padding:22px;border-radius:22px}
.section-kicker{color:var(--accent-strong);font:600 9px var(--mono);letter-spacing:.13em;text-transform:uppercase}
.section-title{margin-top:7px;color:var(--text-main);font:700 18px var(--display)}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.info-cell{padding:12px;border:1px solid rgba(255,255,255,.42);border-radius:15px;background:rgba(255,255,255,.14)}
.info-cell small{display:block;color:var(--text-faint);font:8px var(--mono)}.info-cell strong{display:block;margin-top:6px;font:600 11px var(--display)}

.game-nav{position:static}
.game-nav-list{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.game-nav button{position:relative;width:100%;padding:12px 12px;display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--text-soft);cursor:pointer;text-align:left}
.game-nav button:hover{background:rgba(255,255,255,.24);color:var(--text-main);transform:translateY(-1px)}
.game-nav button:active{transform:translateY(1px) scale(.985);background:rgba(255,255,255,.42);box-shadow:inset 0 2px 5px rgba(70,140,170,.08)}
.game-nav button.active{color:var(--text-main);background:linear-gradient(135deg,rgba(255,255,255,.52),rgba(255,255,255,.16));border-color:rgba(255,255,255,.66);box-shadow:inset 0 1px 0 rgba(255,255,255,.72)}
.game-nav button.active:before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent-strong)}
.game-nav b{font:600 10px var(--display)}.game-nav small{margin-left:auto;color:var(--text-faint);font:7px var(--mono)}

.archive-section{padding:25px;border-radius:24px;scroll-margin-top:20px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:18px}
.section-head h3{font:700 19px var(--display)}.section-head p{color:var(--text-faint);font:8px var(--mono);letter-spacing:.08em}
.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.video-card{min-height:190px;padding:18px;border:1px solid rgba(255,255,255,.5);border-radius:18px;background:rgba(255,255,255,.16);display:flex;flex-direction:column;justify-content:flex-start;cursor:pointer;transition:var(--transition)}
.video-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.9);box-shadow:0 18px 40px rgba(75,157,193,.14)}
.video-thumb{height:92px;border:1px solid rgba(255,255,255,.42);border-radius:14px;display:grid;place-items:center;color:var(--accent-strong);font:600 10px var(--mono);letter-spacing:.1em;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(120,204,233,.08))}
.video-card h4{margin-top:13px;font:600 14px var(--display)}.video-card span{display:block;margin-top:5px;color:var(--text-soft);font-size:9px}
.empty{min-height:190px;display:grid;place-items:center;text-align:center;border:1px dashed rgba(78,185,223,.34);border-radius:18px;background:rgba(255,255,255,.10)}
.empty b{display:block;color:var(--text-soft);font:400 18px/1.5 var(--display);letter-spacing:.01em}.empty span{display:block;margin-top:8px;color:var(--text-soft);font-size:10px;line-height:1.7}.empty em{display:block;margin-top:10px;color:var(--accent-strong);font:8px var(--mono);letter-spacing:.12em;font-style:normal}

.achievement-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.achievement-stat{padding:15px;border:1px solid rgba(255,255,255,.42);border-radius:16px;background:rgba(255,255,255,.14)}
.achievement-stat small{color:var(--text-faint);font:8px var(--mono)}.achievement-stat strong{display:block;margin-top:8px;font:600 23px var(--display)}
.log-list{display:grid;gap:12px}.log-item{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:16px;padding:17px 18px;border:1px solid rgba(255,255,255,.42);border-radius:17px;background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 8px 22px rgba(75,157,193,.035);align-items:start}.log-item time{color:var(--text-faint);font:8px var(--mono);letter-spacing:.05em;padding-top:2px}.log-item strong{display:block;color:var(--text-main);font:600 12px/1.4 var(--display)}.log-item span{display:block;margin-top:5px;color:var(--text-soft);font:11px/1.65 var(--display)}.log-status{align-self:start;justify-self:end;white-space:nowrap;padding:5px 10px;border:1px solid rgba(101,200,154,.34);border-radius:999px;background:rgba(101,200,154,.09);color:#65C89A;font:500 9px/1 var(--display);letter-spacing:.04em}.log-status.planned{border-color:rgba(78,185,223,.32);background:rgba(78,185,223,.08);color:var(--accent)}


/* =====================================================
   Game archive directory: page switching
===================================================== */
.page-content{min-height:0}
.content-page{display:none;flex-direction:column;gap:20px}
.info-card{padding:25px;border-radius:24px}
.section-kicker{color:var(--accent-strong);font:600 9px var(--mono);letter-spacing:.12em}

.info-cell strong{display:block;margin-top:7px;font:600 11px var(--display)}

.video-card h4{margin-top:13px;font:600 14px var(--display)}.video-card span{display:block;margin-top:5px;color:var(--text-soft);font-size:9px}

.empty b{display:block;font:600 18px var(--display)}.empty span{display:block;margin-top:8px;color:var(--text-soft);font-size:10px;line-height:1.7}
.achievement-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.achievement-stat{padding:15px;border:1px solid rgba(255,255,255,.42);border-radius:16px;background:rgba(255,255,255,.14)}.achievement-stat small{color:var(--text-faint);font:8px var(--mono)}.achievement-stat strong{display:block;margin-top:8px;font:600 23px var(--display)}

.video-index-item.active .video-index-kicker{color:rgba(78,185,223,.82)}

.achievement-page{display:grid;gap:18px;}

.achievement-overview .achievement-stat{min-height:92px;padding:16px 17px;border:1px solid rgba(255,255,255,.42);border-radius:16px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.achievement-overview .achievement-stat small{display:block;color:var(--text-faint);font:8px var(--mono);letter-spacing:.06em;}

.achievement-records-head{display:flex;align-items:end;justify-content:space-between;gap:14px;padding-bottom:13px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,.34);}

.achievement-list{display:grid;gap:10px;}
.achievement-item{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.50);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.58),0 8px 22px rgba(75,157,193,.045);transition:transform .22s ease,border-color .22s ease,box-shadow .32s ease,background .42s ease,border-radius .30s ease;}
.achievement-item:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.82);box-shadow:0 13px 28px rgba(75,157,193,.09),inset 0 1px 0 rgba(255,255,255,.78);}

.achievement-item::before{content:"";position:absolute;inset:-2px;pointer-events:none;z-index:2;background:linear-gradient(105deg,transparent 0%,rgba(101,200,154,.12) 34%,rgba(255,255,255,.92) 50%,rgba(101,200,154,.22) 66%,transparent 100%);transform:translateX(135%);opacity:0;mix-blend-mode:screen;}
.achievement-item.is-completing::before{animation:achievementCompleteSweep 620ms cubic-bezier(.2,.7,.25,1) 300ms forwards;}
.achievement-item.is-uncompleting::before{background:linear-gradient(105deg,transparent 0%,rgba(120,204,233,.10) 34%,rgba(255,255,255,.78) 50%,rgba(120,204,233,.18) 66%,transparent 100%);animation:achievementUncompleteSweep 620ms cubic-bezier(.2,.7,.25,1) 300ms forwards;}

.achievement-item-main{position:relative;z-index:1;display:grid;grid-template-columns:30px minmax(0,1fr) 34px;gap:12px;align-items:center;min-height:62px;padding:10px 13px 10px 17px;cursor:pointer;}
.achievement-item-no{color:var(--text-faint);font:8px var(--mono);}

.achievement-item.completed .achievement-item-title{color:#397d61;}
.achievement-complete-toggle{position:relative;width:29px;height:29px;display:grid;place-items:center;border:1px solid rgba(229,139,146,.58);border-radius:50%;background:rgba(229,139,146,.085);color:rgba(177,82,91,.68);cursor:pointer;transition:transform .18s ease,background .32s ease,border-color .32s ease,color .32s ease,box-shadow .36s ease;justify-self:end;}
.achievement-complete-toggle:hover{transform:scale(1.07);border-color:rgba(229,139,146,.82);background:rgba(229,139,146,.16);color:rgba(177,82,91,.92);box-shadow:0 0 14px rgba(229,139,146,.12);}

};

function t(){return isEnglish?copy.en:copy.zh;}

function bindArticleCategoryTabs(){
  const tabs=document.querySelectorAll('.article-index-item');
  const cards=document.querySelectorAll('[data-article-content] .article-card');
  if(!tabs.length) return;
  tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
      const filter=tab.dataset.articleFilter;
      tabs.forEach(t=>{t.classList.toggle('active',t===tab);t.setAttribute('aria-selected',t===tab?'true':'false');});
      cards.forEach(card=>{card.style.display=(filter==='all'||card.dataset.articleType===filter)?'':'none';});
      const empty=tab.closest('.article-category-panel')?.nextElementSibling?.querySelector('[data-article-empty]');
      if(empty){
        const emptyLabel=empty.querySelector('b');
        if(emptyLabel) emptyLabel.textContent=isEnglish?'NO ARTICLE RECORDS':'暂无文章记录';
        empty.style.display=Array.from(cards).some(card=>card.style.display!=='none')?'none':'grid';
      }
    });
  });
}



function bindVideoCategoryTabs(){
  const tabs=document.querySelectorAll('.video-index-item');
  const cards=document.querySelectorAll('[data-video-content] .video-card');
  if(!tabs.length) return;
  tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
      const filter=tab.dataset.videoFilter;
      tabs.forEach(t=>{t.classList.toggle('active',t===tab);t.setAttribute('aria-selected',t===tab?'true':'false');});
      cards.forEach(card=>{card.style.display=(filter==='all'||card.dataset.videoType===filter)?'':'none';});
      let empty=tab.closest('.video-category-panel')?.nextElementSibling?.querySelector('.filter-empty');
      if(!empty){
        const panel=tab.closest('.video-category-panel')?.nextElementSibling;
        if(panel){empty=document.createElement('div');empty.className='filter-empty';empty.textContent=isEnglish?'NO ARCHIVED RECORDS IN THIS CATEGORY':'暂无该分类档案记录';panel.querySelector('.video-list')?.after(empty);}
      }
      if(empty) empty.style.display=Array.from(cards).some(card=>card.style.display!=='none')?'none':'';
    });
  });
}

function updateBreadcrumb(){
  const c=t(), crumb=document.querySelector('.breadcrumb'); if(!crumb)return;
  let html=`<a href="../../index.html" class="interactive">SOLYAN ARCHIVE</a><span>/</span><a href="../../archive.html" data-crumb="archive" class="interactive">${c.breadcrumb.archive}</a><span>/</span><a href="#" data-crumb="game" class="interactive ${currentView.section==='home'?'current':''}">${c.breadcrumb.game}</a>`;
  const sectionLabels={
    video:c.pages.video.title,
    article:c.pages.article.title,
    achievements:c.pages.achievements.title,
    map:c.pages.map.title,
    log:c.pages.log.title
  };
  if(currentView.section!=='home'){
    const label=sectionLabels[currentView.section];
    if(label) html+=`<span>/</span><a href="#" data-crumb-section="${currentView.section}" class="interactive ${currentView.detail?'':'current'}">${label}</a>`;
  }
  if(currentView.detail==='full'||currentView.detail==='story') html+=`<span>/</span><span class="current">${currentView.detail==='full'?c.pages.video.full:c.pages.video.story}</span>`;
  if(currentView.detail==='story-article') html+=`<span>/</span><span class="current">${c.pages.article.story}</span>`;
  crumb.innerHTML=html;
  const game=crumb.querySelector('[data-crumb="game"]');
  if(game) game.addEventListener('click',e=>{e.preventDefault(); if(currentView.section!=='home'||currentView.detail){ triggerFeedback(game); window.setTimeout(()=>jumpTo('home'),100); }});
  const section=crumb.querySelector('[data-crumb-section]');
  if(section) section.addEventListener('click',e=>{
    e.preventDefault();
    const id=section.dataset.crumbSection;
    if(id==='video'&&currentView.detail){ triggerFeedback(section); window.setTimeout(backToVideo,100); }
    else if(id==='article'&&currentView.detail){ triggerFeedback(section); window.setTimeout(backToArticle,100); }

<section class="article-chapter" id="re0-chapter-1">
  <h2>第一章：黄道特快列车</h2>
  <h3>进入黄道特快列车</h3>
  <ol class="article-numbered">
    <li>瑞贝卡进入二等车厢，发现座位上满是“尸体”。她表明身份呼叫回应，却只听到收音机播报。</li>
    <li>转身时，一具尸体突然变成丧尸扑来，随后又有两只丧尸从邻车进入。</li>
  </ol>
  <aside class="article-note"><strong>小知识</strong>如果击杀全部三只丧尸，会触发额外过场：瑞贝卡看着尸体震惊地说：“刚刚是怎么回事？我以为他们已经死了。”如果逃跑未全杀，则不触发此动画。</aside>
  <p>解决完这些丧尸后，瑞贝卡向列车头部前进，在电子门前发现一具尸体。搜索尸体会发现一把“列车（餐车）钥匙”。</p>

  <h3>与比利合作</h3>
  <ol class="article-numbered">
    <li>搜索尸体的过程中会遇到比利。经过一段对话后，瑞贝卡试图逮捕他，比利则表示“已经戴上手铐了”，随后转身离开。</li>
    <li>Bravo队员爱德华·杜威（Edward Dewey）重伤破窗而入，警告瑞贝卡森林里全是丧尸和怪物，随后死去。丧尸犬跟随跳入，瑞贝卡击退它们，然后朝餐车方向前进。</li>
    <li>在一节车厢中，队长恩里科通过无线电警告：比利杀害23人，非常危险，务必小心。</li>
    <li>随后瑞贝卡用列车钥匙打开后门，比利出现并提出两人合作，瑞贝卡很警惕地拒绝了。</li>
    <li>瑞贝卡独自一人上了二楼，往前走时发现一位乘客。乘客的头落下，随后露出真面目——水蛭拟态马库斯（水蛭人）。</li>
    <li>击杀水蛭人后，水蛭不再组合，群体冲向瑞贝卡。危急时刻，比利出手帮助了她。随后他们发现了在窗外高歌的水蛭女王。</li>
    <li>比利再一次提出合作，瑞贝卡正式同意。</li>
  </ol>

  <h3>巨型蝎子</h3>
  <ol class="article-numbered">
    <li>两人通过后方的窗户爬上黄道特快列车车顶，瑞贝卡在前方接回电源线，恢复了电力。</li>
  </ol>
  <aside class="article-note"><strong>小知识</strong>接回电源线会有不同内容：如果由瑞贝卡接回电源线，她会掉落到二楼车厢；比利也有对应情况。这会影响后续击杀巨型蝎子时所操控的角色。</aside>
  <ol class="article-numbered" start="2">
    <li>两人突然被水蛭袭击，摔落在车厢二楼。由于门锁住，无法开启，需要某种道具才能撬开门。</li>
    <li>随后比利前往车长室，打开门后发现通往二楼的隐藏通道。他进入二楼，在酒吧车厢找到了冰锥；原路返回时，巨型蝎子戳破车顶袭来。</li>
    <li>解决巨型蝎子后拿取孔盖扳手，返回厨房车厢，用送餐电梯将冰锥送到二楼车厢，瑞贝卡则使用冰锥打开房门。</li>
  </ol>

  <h3>紧急制动</h3>
  <ol class="article-numbered">
    <li>瑞贝卡在厨房和比利会合。比利用孔盖扳手打开厨房车厢的通道孔盖，通过一系列道具搜寻，最终在车长公文包里获得蓝色钥匙卡。</li>
    <li>用蓝色钥匙卡打开通往驾驶室的电子门。在一场动画中，Delta小队被水蛭袭击，全军覆没。</li>
  </ol>
  <aside class="article-note"><strong>补充说明</strong>此前列车重新启动、加速失控，是因为阿尔伯特·威斯克（Albert Wesker）与威廉·柏金（William Birkin）为了不让T病毒泄漏一事传播出去，下令让U.S.S. Delta小队彻底摧毁列车。但Delta小队登车后很快也被水蛭感染，导致列车失控。</aside>
  <ol class="article-numbered" start="3">
    <li>瑞贝卡和比利到达驾驶室后商讨策略。由于制动需要前后两端同时操作：一人在车头驾驶室，一人在车尾甲板，所以两人再一次分头行动。</li>
  </ol>
  <aside class="article-note"><strong>小知识</strong>如果让瑞贝卡去车尾启动制动，她会在途中遇到已变成丧尸的队友爱德华，触发专属的悲伤过场；如果由比利去车尾，则不触发此动画。</aside>
  <ol class="article-numbered" start="4"><li>成功启动制动后，列车虽减速，但惯性过大，最终在通往干部培训所的隧道中脱轨侧翻。</li></ol>
  <aside class="article-note"><strong>黄道特快列车介绍</strong>
    <ol>
      <li>作用：黄道特快列车（Ecliptic Express）是安布雷拉美国公司（Umbrella USA）用于在城市间运送员工的特快列车服务。使用私人列车安全运送生化武器、研究样本和文件，以避免间谍活动的风险。</li>
      <li>结构：共有六节车厢，包括一节带货舱的厨房车厢、一节酒吧兼沙龙车厢，以及四节配备精致床铺和餐厅的车厢。</li>
      <li>起因：1998年7月，黄道特快列车驶入浣熊森林深处，计划于7月23日晚抵达安布雷拉公司干部培训所。此行是为培训所运送科学家、技术人员和工人，负责培训所的翻新和重新开放。</li>
    </ol>
  </aside>
</section>

<section class="article-chapter" id="re0-chapter-2">
  <h2>第二章：培训所</h2>
  <p>火车在隧道中脱轨侧翻后，瑞贝卡与比利从残骸中爬出。</p>
  <h3>进入培训所</h3>
  <ol class="article-numbered">
    <li>他们清理周围丧尸，进入下水道通道，沿水路前进并爬上梯子。</li>
    <li>两人从下水道爬出，进入一座豪华大厅。比利注意到墙上的安布雷拉（保护伞）标志，震惊地意识到这里是安布雷拉干部培训所。</li>
    <li>瑞贝卡被大厅楼梯上方的画像吸引，走近后发现画像中的人正是之前在火车上见过的神秘男子——詹姆斯·马库斯（James Marcus），安布雷拉创始人之一、培训所首任所长。</li>
    <li>与此同时，监控室中的威斯克（Albert Wesker）和柏金（William Birkin）正在监视两人。神秘男子（水蛭女王）黑入监控画面，表示是自己把T病毒散播到洋馆和列车上，这是对保护伞的复仇行动；随后他用水蛭重现马库斯的形象，并留下信息：10年前保护伞暗杀马库斯，威斯克和柏金也有参与。</li>
  </ol>
  <h3>初步探索培训所</h3>
  <p>两人开始探索培训所主建筑。这里是多层结构，包含大厅、会议室、图书室、画廊、宿舍等区域。在途中获得曲柄把手后，比利通过升降梯将瑞贝卡送到三楼区域；瑞贝卡随后开启门锁，使比利也能前往三楼，最后两人会合。</p>
  <h3>巨型蜈蚣</h3>
  <ol class="article-numbered">
    <li>三楼一个笼子里面有一把钥匙，需要两人配合才能取得：比利通过转轴拉起笼子，瑞贝卡则去捡取钥匙。</li>
    <li>当瑞贝卡捡起钥匙时，一只巨型蜈蚣从排水口进入并抓住瑞贝卡。</li>
    <li>比利击杀巨型蜈蚣后，两人拿起钥匙，现在可以开启培训所的火纹门房间。</li>
  </ol>
  <h3>前往地下室</h3>
  <ol class="article-numbered">
    <li>两人解锁时钟谜题，并从不同房间获得恶魔身体、恶魔翅膀、天使身体、天使翅膀，将两者两两组合。</li>
    <li>将完整雕像放到大厅的天平女神像上，平衡善恶，开启通往地下室的暗门。</li>
    <li>探索地下室／刑讯室区域时，瑞贝卡站在比利的肩膀上，再通过通风口进入。</li>
    <li>瑞贝卡进入后发现门无法打开，于是调整电压装置（按文件提示将功率调至70）。神秘男子（水蛭女王）通过摄像头观察到瑞贝卡的行为，随后释放变异猴子袭击她。为了躲避猴子的攻击，瑞贝卡往后闪避，地板突然塌陷，她坠入下方。</li>
    <li>威斯克与柏金有一段对话。威斯克打算利用S.T.A.R.S.作为T病毒的实验数据，最后离开设施；柏金为了继续研究G病毒，在设施中停留了一段时间，并打算在事情变得棘手之前启动自爆装置，将整座设施夷为平地。</li>
    <li>随后发现瑞贝卡并没有完全坠落，而是抓住了边缘。</li>
  </ol>
  <h3>拯救瑞贝卡</h3>
  <ol class="article-numbered">
    <li>比利通过无线电听到求救，前往救援，在紧要关头拉回瑞贝卡。瑞贝卡的无线电响起，接听后是队长。队长询问找到比利没有，她回答没有——这也是她第一次出任务就违抗命令。</li>
    <li>瑞贝卡询问比利，只想知道真相：他真的杀了23个人吗？比利脑中闪出一段回忆：在去年的这个时候，他在非洲执行突袭位于丛林深处的突击队藏身地点的任务，队员途中死亡惨重。当他们发现目标地点其实是村庄时，才知道派任务的人掌握了错误情报。但由于不能空手而归，队长命令他们袭击村民。比利拒绝执行并试图阻止，最终却被诬陷为杀害23人的凶手，判处死刑。</li>
  </ol>
  <h3>前往教堂</h3>
  <ol class="article-numbered">
    <li>瑞贝卡和比利发现天文台有一扇门无法打开。为了继续深入，他们观察到天文台装置需要三个石板；根据之前的线索，那些石板应该对应马库斯制定的三大原则：纪律、服从、团结。于是两人开始寻找石板。</li>
    <li>集齐三个石板后，天文台下降，后门打开，出现一条通往教堂的路。</li>
  </ol>
  <h3>巨型蝙蝠</h3>
  <ol class="article-numbered">
    <li>到达教堂后，门无法打开。两人发现教堂右侧一个小房间里有机关，需要一个人踩着压力板，另一个人才能进入，于是开始分工行动。</li>
    <li>瑞贝卡进入后，一只巨型蝙蝠突然袭来。处理完蝙蝠后，可以继续推进。</li>
  </ol>
  <aside class="article-note"><strong>分支内容</strong>这里可以由任意一个角色踩着压力板，中途可以随时进出。</aside>
  <h3>前往研究所</h3>
  <ol class="article-numbered">
    <li>随后瑞贝卡使用钩锁枪从洞口攀爬到屋顶，在教堂后院打开电闸。教堂左侧电梯通电后即可使用。</li>
    <li>最终两人乘坐电梯前往研究所。</li>
  </ol>
  <aside class="article-note"><strong>培训所介绍</strong>
    <ol>
      <li>作用：从开办到1978年，该机构的主要功能是一所寄宿学校，招收提前从大学毕业的神童。这些学生被寄予厚望，希望他们成为下一代高管，既要纪律严明，又要精通商业和科学领域。保护伞公司联合创始人詹姆斯·马库斯博士被任命为机构主任，但日常运营由助理主任负责；马库斯则专注于实验室综合体内的T病毒研究。</li>
      <li>起因／结果：安布雷拉高管培训学校（保护伞培训所）成立日期已知为1968年8月，是位于阿克雷山脉的寄宿制学校兼实验室综合体，距离浣熊市至少八英里。它是保护伞公司最初的基地之一，也是T病毒计划的研发地。1978年，由于一系列非法人体实验被保护伞总部掩盖，培训所关闭，地面设施逐渐荒废，只有詹姆斯·马库斯博士在地下实验室继续研究长达十年。1998年，一次翻新尝试以失败告终，整个团队都被变异水蛭感染或杀死。为了控制疫情并继续掩盖黑暗秘密，该设施随后被摧毁。</li>

<li>Rebecca uses the train key to open the rear door. Billy appears and suggests they work together, but she warily refuses.</li>
<li>Rebecca goes upstairs alone and finds a passenger. The passenger's head drops away, revealing its true form: a leech creature mimicking Marcus, often called a Leech Man.</li>
<li>After Rebecca defeats it, the leeches stop holding their human shape and swarm toward her. Billy steps in just in time to help. The two then spot the Queen Leech singing outside the window.</li>
<li>Billy offers to team up again, and this time Rebecca agrees.</li>
</ol>
<h3>The Giant Scorpion</h3>
<ol class="article-numbered">
<li>The two climb through a rear window onto the roof of the Ecliptic Express. Rebecca reconnects a power cable near the front, restoring the electricity.</li>
</ol>
<aside class="article-note"><strong>Quick Fact</strong>The character who reconnects the cable changes what happens next. If Rebecca does it, she falls into a second-floor carriage; Billy has a corresponding version. This affects which character you control during the later fight with the giant scorpion.</aside>
<ol class="article-numbered" start="2">
<li>The leeches suddenly attack, sending them crashing into a second-floor carriage. The door is locked, so they need a tool to force it open.</li>
<li>Billy heads to the conductor's room and discovers a hidden passage to the upper floor. He reaches the bar carriage and finds an Ice Pick. On his way back, a giant scorpion bursts through the roof.</li>
<li>After defeating the scorpion, they take the Panel Opener. Back in the kitchen carriage, they use the service lift to send the Ice Pick upstairs, allowing Rebecca to unlock the door.</li>
</ol>
<h3>Emergency Braking</h3>
<ol class="article-numbered">
<li>Rebecca meets Billy in the kitchen. Billy uses the Panel Opener to remove a hatch in the kitchen carriage. After searching for several items, they find a blue keycard inside the conductor's briefcase.</li>
<li>The blue keycard opens the electronic door to the driver's cab. A cutscene shows the entire U.S.S. Delta Team being attacked by leeches and wiped out.</li>
</ol>
<aside class="article-note"><strong>Additional Context</strong>The train restarted and accelerated out of control because Albert Wesker and William Birkin ordered the U.S.S. Delta Team to destroy it and keep news of the T-Virus outbreak from spreading. The Delta Team boarded the train, but the leeches quickly infected them, leaving the train out of control.</aside>
<ol class="article-numbered" start="3">
<li>Rebecca and Billy reach the driver's cab and discuss a plan. The brakes must be activated at both ends at the same time—one person in the front cab and the other on the rear deck—so they split up again.</li>
</ol>
<aside class="article-note"><strong>Quick Fact</strong>If Rebecca goes to the rear to activate the brakes, she encounters Edward, now a zombie, and a special, tragic cutscene plays. If Billy goes instead, the scene does not trigger.</aside>
<ol class="article-numbered" start="4"><li>The brakes slow the train, but it cannot stop in time. It derails and overturns in a tunnel leading to the Executive Training Facility.</li></ol>
<aside class="article-note"><strong>About the Ecliptic Express</strong>
<ol>
<li>Purpose: The Ecliptic Express is a private train service operated by Umbrella USA to move employees between locations. Private rail transport also allowed Umbrella to move biological weapons, research samples, and documents with less risk of espionage.</li>
<li>Layout: The train has six carriages: a kitchen carriage with a cargo area, a bar and lounge carriage, and four carriages with comfortable beds and dining areas.</li>
<li>Background: In July 1998, the Ecliptic Express entered Raccoon Forest and was due to reach Umbrella's Executive Training Facility on the evening of July 23. It was carrying scientists, technicians, and workers to renovate the facility and prepare it to reopen.</li>
</ol>
</aside>
</section>
<section class="article-chapter" id="re0-chapter-2">
<h2>Chapter 2: The Training Facility</h2>
<p>After the train derails in the tunnel, Rebecca and Billy climb out of the wreckage.</p>
<h3>Entering the Training Facility</h3>
<ol class="article-numbered">
<li>They clear the nearby zombies, enter a sewer passage, follow the waterway, and climb a ladder.</li>
<li>They emerge from the sewer into a grand hall. Billy notices the Umbrella logo on the wall and realizes, to his shock, that they are inside Umbrella's Executive Training Facility.</li>
<li>Rebecca is drawn to a portrait above the staircase. Up close, she recognizes the man as the mysterious figure she saw on the train: James Marcus, one of Umbrella's founders and the facility's first director.</li>
<li>Meanwhile, Albert Wesker and William Birkin watch the pair from a control room. The mysterious man—the Queen Leech—hacks into the surveillance feed and claims responsibility for spreading the T-Virus to the mansion and the train as an act of revenge against Umbrella. Using leeches, it recreates Marcus's appearance and reveals that Umbrella assassinated him ten years earlier, with Wesker and Birkin involved.</li>
</ol>
<h3>First Steps Through the Facility</h3>
<p>Rebecca and Billy explore the main building, a multi-level complex with a grand hall, meeting rooms, a library, an art gallery, dormitories, and more. After finding a crank handle, Billy uses a lift to send Rebecca to the third floor. She unlocks a door so Billy can reach the same area, and they reunite.</p>
<h3>The Giant Centipede</h3>
<ol class="article-numbered">
<li>A key sits inside a cage on the third floor, and the two must work together to reach it. Billy turns a mechanism to raise the cage while Rebecca grabs the key.</li>
<li>As Rebecca takes the key, a giant centipede crawls in through a drain and grabs her.</li>
<li>Billy kills the centipede, and the pair take the key. They can now open the room with the Fire Key door.</li>
</ol>
<h3>Heading Underground</h3>
<ol class="article-numbered">
<li>They solve the clock puzzle and collect four statue parts from different rooms: a Devil's Body, Devil's Wing, Angel's Body, and Angel's Wing. They combine the matching parts into two complete statues.</li>
<li>Placing the completed statues on the scales held by the goddess statue in the main hall balances good and evil, opening a hidden passage to the basement.</li>
<li>In the basement and torture-room area, Rebecca stands on Billy's shoulders and climbs through a ventilation shaft.</li>
<li>Once inside, Rebecca finds that the door will not open. She adjusts the power regulator, setting it to 70 as indicated by a document. The mysterious man—the Queen Leech—watches through a camera and releases infected monkeys to attack her. Rebecca dodges backward, but the floor suddenly collapses and she falls below.</li>
<li>Wesker and Birkin discuss using S.T.A.R.S. as test subjects to gather data on the T-Virus. Wesker leaves the facility, while Birkin stays behind to continue his G-Virus research. Before things get out of hand, he plans to activate the self-destruct system and level the entire facility.</li>
<li>Rebecca has not fallen all the way down; she manages to catch the edge.</li>
</ol>
<h3>Rescuing Rebecca</h3>
<ol class="article-numbered">
<li>Billy hears her call for help over the radio and rushes to save her, pulling her up just in time. Rebecca's radio then rings. Enrico asks whether she has found Billy, and she says no—the first time she has disobeyed an order on a mission.</li>
<li>Rebecca asks Billy for the truth: did he really kill 23 people? Billy remembers a mission in Africa the previous year, when his unit was sent to raid a commando hideout deep in the jungle. Several soldiers died on the way. When they arrived, they discovered the target was actually a village and that their superiors had acted on bad intelligence. The commanding officer ordered them to attack the villagers because the unit could not return empty-handed. Billy refused and tried to stop the massacre, but he was framed for the deaths of 23 people and sentenced to death.</li>
</ol>
<h3>Heading to the Church</h3>
<ol class="article-numbered">
<li>Rebecca and Billy find a locked door in the observatory. To proceed, they need three stone tablets for the mechanism. Based on earlier clues, the tablets represent Marcus's three principles: Discipline, Obedience, and Unity. They begin searching for them.</li>
<li>Once all three tablets are in place, the observatory descends and its rear door opens, revealing a route to the church.</li>
</ol>
<h3>The Giant Bat</h3>
<ol class="article-numbered">
<li>The church door will not open. In a small room on the right, they find a mechanism that requires one character to stand on a pressure plate so the other can enter. They split up to operate it.</li>
<li>A giant bat suddenly attacks Rebecca after she enters. Once it is dealt with, they can continue.</li>
</ol>
<aside class="article-note"><strong>Optional Detail</strong>Either character can stand on the pressure plate, and you can switch in and out whenever you like.</aside>
<h3>Heading to the Research Facility</h3>
<ol class="article-numbered">
<li>Rebecca uses the grappling hook to climb through an opening to the roof. In the church courtyard, she turns on the power. The elevator to the left of the church becomes operational.</li>
<li>The two take the elevator down to the research facility.</li>
</ol>
<aside class="article-note"><strong>About the Training Facility</strong>
<ol>
<li>Purpose: From its opening until 1978, the facility primarily served as a boarding school for gifted children who graduated from university early. They were expected to become Umbrella's next generation of executives, with strong discipline and knowledge of business and science. Umbrella co-founder Dr. James Marcus was appointed director, but an assistant director handled day-to-day operations while Marcus focused on T-Virus research in the laboratory complex.</li>
<li>Background and fate: The Umbrella Executive Training School was established in August 1968. Located in the Arklay Mountains at least eight miles from Raccoon City, it was both a boarding school and laboratory complex, and one of Umbrella's earliest bases for T-Virus research. The school closed in 1978 after Umbrella covered up a series of illegal human experiments. The above-ground buildings fell into disrepair, while Dr. Marcus continued researching in the underground lab for another decade. A renovation attempt in 1998 ended in disaster: the team was infected or killed by mutated leeches. The facility was later destroyed to contain the outbreak and conceal Umbrella's secrets.</li>
<li>Layout: The first floor (1F) contained the entrance hall, restrooms, kitchen and dining room, a vaccine research room, and a heating boiler room. The west wing of the second floor (2F) held the library, reference room, infirmary, and staff lounge; the east wing held the meeting room, CCTV and broadcast room, bar, workshop, and gas lab. The third floor (3F) contained animal cages, the clock tower, and a garden. B1 could be reached through a hidden passage in the main hall and was used by Marcus to torture test subjects. B2, accessible through the boiler room, led to the student dormitories and shooting range. A train tunnel and platform beneath the facility were used to transport students.</li>
</ol>
</aside>
</section>
<section class="article-chapter" id="re0-chapter-3">
<h2>Chapter 3: The Research Facility</h2>
<p>The elevator from the church takes Rebecca and Billy to the research facility.</p>
<h3>Exploring the Research Facility</h3>
<ol class="article-numbered">
<li>They enter the records room, where old documents belonging to Marcus are scattered across a desk. In his diary, he calls the leeches 'my children' and notes that he hid them in special capsules that can only be opened with a specific stripping agent.</li>
<li>Rebecca uses the grappling hook to climb through a ceiling opening into the upper research preparation room. A Marcus look-alike suddenly appears. After defeating it, she finds a leech sample container in a nearby machine and a map of the facility on the wall.</li>
</ol>
<h3>Going Deeper</h3>
<ol class="article-numbered">
<li>To open Marcus's locked room, Rebecca synthesizes a stripping agent and combines it with the leech sample container to create a Blue Leech Charm.</li>
<li>She passes the charm to Billy through the delivery hatch in the operating room. Billy uses it to unlock the first of Marcus's doors.</li>
<li>Inside, they find an item needed for the cable car and an old photograph. The person in the photo may be Marcus's son, as the image shows Marcus when he was younger.</li>
</ol>
<h3>Starting the Cable Car</h3>
<ol class="article-numbered">
<li>They split up to gather the items needed to start the cable car and open the route to it. In the control room, they insert the two required components.</li>
<li>Just as they prepare to leave by cable car, infected monkeys and a Leech Man (the Marcus look-alike) attack. A monkey knocks Billy off the platform, while the Leech Man blocks Rebecca's path. She manages to defeat it.</li>
<li>When the power fails again, Rebecca returns to the cable-car control room and reinstalls the components. She then rides alone to the treatment plant.</li>
</ol>
</section>
<section class="article-chapter" id="re0-chapter-4">
<h2>Chapter 4: The Factory</h2>
<p>An infected monkey knocks Billy off the platform, leaving Rebecca to continue to the factory alone.</p>
<h3>Activating the Turntable</h3>
<ol class="article-numbered">
<li>After leaving the cable car from the research facility, Rebecca enters the factory area alone. It is an Umbrella chemical plant that looks like an ordinary industrial site, but it actually serves as an underground hub connecting the training facility, research facility, and treatment plant. The air is damp, the lighting is dim, and metal clanks and distant monster sounds echo through the area.</li>
<li>Rebecca explores the control center and monitoring room. On the surveillance screens, she sees a Proto Tyrant being held in a containment area and finds the factory key. She returns to the control center and uses the key to activate the turntable.</li>
</ol>
<h3>Meeting the Captain</h3>
<ol class="article-numbered">
<li>After the turntable descends, Rebecca reaches a lower level and encounters Captain Enrico Marini, the leader of Bravo Team.</li>
<li>They speak briefly. Enrico tells Rebecca about a nearby mansion—the main setting of the original Resident Evil—and warns her to be careful. Rebecca still needs to find Billy, so she does not leave with Enrico. This is the last time she sees her captain.</li>
</ol>
<h3>The Proto Tyrant</h3>
<ol class="article-numbered">
<li>Rebecca finds an elevator key nearby. As she uses it to start the elevator, the Proto Tyrant (T-001) suddenly appears.</li>
</ol>
<aside class="article-note"><strong>Quick Fact</strong>This early Tyrant prototype suffered severe nervous-system damage after being injected with too much T-Virus. It is clumsy but extremely powerful. You do not kill it for good in this fight; it returns later at the treatment plant.</aside>
<h3>Heading to the Treatment Plant</h3>
<ol class="article-numbered"><li>After the Proto Tyrant is driven back, the elevator can be used. Rebecca selects floor LV4 to reach the treatment plant.</li></ol>
</section>
<section class="article-chapter" id="re0-chapter-5">
<h2>Chapter 5: The Treatment Plant</h2>
<p>Rebecca takes the elevator to the treatment plant alone.</p>
<h3>Restoring Power</h3>
<ol class="article-numbered">
<li>During the elevator ride, a camera feed shows the mysterious man beginning the final stage of his revenge.</li>
<li>Rebecca exits the factory elevator and reaches the treatment plant entrance alone. The area is damp and dark, with pipes everywhere, standing water, and rust.</li>
</ol>
<aside class="article-note"><strong>Quick Fact: The Treatment Plant</strong>Umbrella built this large wastewater and waste-treatment facility inside natural underground caverns. It processed wastewater and biological research waste from the training facility, research facility, and other Umbrella sites.</aside>
<ol class="article-numbered" start="3">
<li>Rebecca spots Billy in the river below, but the strong current sweeps him away.</li>
<li>The central control room has no power. Rebecca adjusts the power-regulation grid on the wall to restore electricity throughout the facility, then takes an elevator deeper underground.</li>
</ol>
<h3>Rescuing Billy</h3>
<ol class="article-numbered">
<li>Along the way, Rebecca passes the recreation room, maintenance areas, and water-storage rooms, encountering zombies and Leech Men. Eventually, she finds Billy washed onto a platform by the current and pulls him to safety. The two are reunited.</li>
</ol>
<h3>The Proto Tyrant Returns</h3>
<ol class="article-numbered">
<li>They continue through the dormitories, purification room, and power and air-control areas. Near the treatment room, the Proto Tyrant appears again for a second fight.</li>
<li>This time it is more aggressive and takes heavier firepower to bring down. After defeating it, they can collect the motherboard and continue.</li>
</ol>
<h3>Meeting the Queen Leech</h3>
<ol class="article-numbered">
<li>Working together, they obtain a keycard that opens the door leading to the incinerator.</li>
<li>Inside, the mysterious young man finally reveals the truth: he is the Queen Leech. In 1988, Spencer ordered the U.S.S. to assassinate Marcus. Wesker and Birkin carried out the operation and stole his research. Marcus's body and the Queen Leech were dumped at the treatment plant. The Queen Leech fed on Marcus's corpse and, after consuming his brain, absorbed his memories and DNA. Over the next ten years, it developed into its current form and came to believe it was Marcus reborn, driven by a desire for revenge against Umbrella and Spencer.</li>
<li>The Queen Leech then takes on a humanoid leech form and fights Rebecca and Billy. They eventually defeat it.</li>
</ol>
<h3>The Final Battle</h3>
<ol class="article-numbered">
<li>They must insert keys into locks on both sides of the cargo-lift door. Once it opens, they enter a loading area stocked with supplies. After preparing, they activate the lift to reach a warehouse on the surface.</li>
<li>As the lift rises, the Queen Leech bursts out of the shaft wall. An announcement warns that Birkin has activated the self-destruct sequence and everyone must evacuate. The Queen Leech forces the lift out of the shaft, throwing Rebecca and Billy into the surface warehouse. It follows them up, larger and more ferocious than before—the second phase begins.</li>
<li>With five minutes left before detonation, Rebecca and Billy fight the Queen Leech. Sunlight slips through a gap in the roof, and the creature suddenly recoils in pain. Rebecca realizes it is vulnerable to sunlight. Billy draws its attention while Rebecca rushes to turn the four valves around the warehouse and open the skylights.</li>
<li>The skylights open fully and morning sunlight pours in, burning the Queen Leech until it can barely move. Rebecca tosses her magnum to Billy. He raises it and says, 'Hey, Queen, feast on this!' before shooting straight through the creature. Its remains fall down the elevator shaft and into the explosion below.</li>
<li>The training facility and treatment plant are destroyed together. Rebecca and Billy escape as the structures collapse.</li>
</ol>
<aside class="article-note"><strong>About the Treatment Plant</strong>
<ol>
<li>Purpose: This unnamed wastewater plant is owned and operated by Umbrella. It lies about eight miles northwest of Raccoon City, mostly built along an underground river inside limestone caverns. A surface level sits atop a cliff overlooking the Umbrella factory. The plant primarily handled wastewater from NEST, the research facility, and the training facility.</li>
<li>Background and fate: The exact construction date is unknown, but the plant was already operating by 1978. Dr. Marcus used it to secretly dispose of children killed during the T-Virus project. After Marcus was assassinated in 1988, his body was dumped in the same plant. In July 1998, NEST chief researcher William Birkin activated the self-destruct system to contain the outbreak. The treatment plant was ultimately presumed destroyed.</li>
<li>Layout: The plant occupies a series of large natural limestone caverns in the Arklay Mountains and treats wastewater discharged by Umbrella facilities into the underground river. It connects directly to the NEST system, and a freight elevator leads to a large warehouse near the training facility. The complex mainly consists of sewage and water-treatment tanks, along with staff dormitories, a bar, and a recreation lounge.</li>
</ol>
</aside>
</section>
<section class="article-chapter" id="re0-chapter-6">
<h2>Epilogue: Parting Ways</h2>
<ol class="article-numbered">
<li>The two reach the edge of a cliff. Billy throws his handcuffs down the slope and lies on the ground, catching his breath. Rebecca spots the mansion below and recognizes it as the place Enrico told her to meet up with the team.</li>
<li>She removes Billy's dog tags and puts them around her own neck. 'It's time to say goodbye. Officially, Lieutenant Billy Coen is dead.' Billy gives a wry smile: 'So I guess I'm a zombie now.'</li>
<li>They salute each other. Rebecca turns toward the mansion, while Billy watches her go and gives her a thumbs-up. He quietly says, 'Thanks, Rebecca.' The camera settles on a spiderweb near the mansion, hinting at the disaster to come.</li>
</ol>
<p>After the facility collapses, Rebecca and Billy finally get a brief moment to catch their breath. Rebecca decides to let Billy go rather than hand him back to the military police hunting him. Their paths separate: Billy gets a chance to keep living, while Rebecca prepares to return to the mission and continue her duty as a S.T.A.R.S. officer.</p>
<p>Rebecca then heads toward the nearby mansion. She has no idea that an even greater disaster awaits her and Alpha Team. For players, Resident Evil 0 leads directly into the original Resident Evil: the strange events in the mountains are not over, and the investigation will eventually lead to the mansion incident that shocks Raccoon City.</p>
<p>Resident Evil 0 is therefore not an isolated story unrelated to the mansion incident. It fills in why S.T.A.R.S. Bravo Team entered the mountains, reveals the dark history of Umbrella's early research, and explains why Rebecca endured such a brutal fight for survival before the original game's story began.</p>
</section>
<p class="article-lead article-conclusion" id="re0-conclusion">Thanks for reading, everyone! This article follows the game's events, with some background details drawn from in-game documents and environmental storytelling. We can expand it further with dedicated character files, document transcripts, and facility layouts. Play happy, live healthy!</p>
<div class="article-return-wrap"><button class="article-return-top interactive" data-article-return-top="" type="button">Back to top</button></div>
</article>`;

function achievementMarkup(){
  const completed=getCompletedAchievements();
  const items=ACHIEVEMENTS.map(([id,enName,zhName,category,enHow,zhHow])=>{
    const isDone=completed.has(id), name=isEnglish?enName:zhName, how=isEnglish?enHow:zhHow;
    const status=isDone?(isEnglish?'Completed':'已完成'):(isEnglish?'Not Completed':'未完成');
    return `<article class="achievement-item${isDone?' completed':''}" data-achievement-item data-achievement-id="${id}" data-achievement-category="${category}" data-completed="${isDone?'true':'false'}"><div class="achievement-item-main" tabindex="0" role="button" aria-expanded="false"><span class="achievement-item-no">${id}</span><span class="achievement-item-title">${name}</span><button class="achievement-complete-toggle" type="button" aria-label="${isDone?(isEnglish?'Mark as incomplete':'标记为未完成'):(isEnglish?'Mark as completed':'标记为已完成')}" aria-pressed="${isDone}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.2 6.5 11.4 12.8 4.8"/></svg></button></div><div class="achievement-detail"><div class="achievement-detail-inner"><span class="achievement-detail-label">${isEnglish?'HOW TO COMPLETE':'如何完成'}</span><p>${how}</p><div class="achievement-status-row"><span class="achievement-status-label">${isEnglish?'STATUS':'状态'}</span><span class="achievement-status-text">${status}</span></div></div></div></article>`;
  }).join('');
  const labels=isEnglish?{status:'STATUS',category:'CATEGORY',all:'ALL',completed:'COMPLETED',incomplete:'INCOMPLETE'}:{status:'状态',category:'分类',all:'全部',completed:'已完成',incomplete:'未完成'};
  const cats=Object.entries(ACHIEVEMENT_CATEGORY_NAMES).map(([key,v])=>`<button type="button" data-achievement-category-filter="${key}">${isEnglish?v.en:v.zh}</button>`).join('');
  return `<section class="achievement-page"><section class="page-panel glass achievement-overview-panel"><div class="page-panel-head"><div><h3>${t().pages.achievements.title}</h3><p>${t().pages.achievements.intro}</p></div></div><div class="achievement-overview"><div class="achievement-stat"><small>${t().pages.achievements.time}</small><strong>22.4h</strong></div><div class="achievement-stat"><small>${t().pages.achievements.rate}</small><strong>100%</strong></div><div class="achievement-stat"><small>${t().pages.achievements.count}</small><strong>47 / 47</strong></div></div></section><section class="page-panel glass achievement-records-panel"><div class="achievement-records-head"><h4>${isEnglish?'Achievement Records':'成就记录'}</h4></div><div class="achievement-filters"><div class="achievement-filter-row"><span class="achievement-filter-label">${labels.status}</span><div class="achievement-filter"><button class="active" type="button" data-achievement-status="all">${labels.all}</button><button type="button" data-achievement-status="completed">${labels.completed}</button><button type="button" data-achievement-status="incomplete">${labels.incomplete}</button></div></div><div class="achievement-filter-row"><span class="achievement-filter-label">${labels.category}</span><div class="achievement-filter"><button class="active" type="button" data-achievement-category-filter="all">${labels.all}</button>${cats}</div></div></div><div class="achievement-list" data-achievement-content>${items}</div><div class="achievement-filter-empty" data-achievement-empty>${isEnglish?'NO MATCHING ACHIEVEMENTS':'暂无符合条件的成就'}</div></section></section>`;
}
function bindAchievementFilters(){
  const root=document.querySelector('.achievement-records-panel');
  if(!root)return;

  let status='all';
  let category='all';

  const apply=()=>{
    const completed=getCompletedAchievements();
    let visible=0;

    root.querySelectorAll('[data-achievement-item]').forEach(item=>{
      const done=completed.has(item.dataset.achievementId);
      const statusMatch=status==='all'||(status==='completed'&&done)||(status==='incomplete'&&!done);
      const categoryMatch=category==='all'||item.dataset.achievementCategory===category;
      const show=statusMatch&&categoryMatch;

      item.classList.toggle('completed',done);
      item.dataset.completed=done?'true':'false';
      item.style.display=show?'':'none';
      if(show)visible++;

      const toggle=item.querySelector('.achievement-complete-toggle');
      if(toggle){
        toggle.setAttribute('aria-pressed',String(done));
        toggle.setAttribute('aria-label',done
          ?(isEnglish?'Mark as incomplete':'标记为未完成')
          :(isEnglish?'Mark as completed':'标记为已完成'));
      }

      const text=item.querySelector('.achievement-status-text');
      if(text)text.textContent=done
        ?(isEnglish?'Completed':'已完成')
        :(isEnglish?'Not Completed':'未完成');
    });

    const empty=root.querySelector('[data-achievement-empty]');
    if(empty)empty.style.display=visible?'none':'grid';
  };

  root.addEventListener('click',event=>{
    const statusButton=event.target.closest('[data-achievement-status]');
    if(statusButton&&root.contains(statusButton)){
      status=statusButton.dataset.achievementStatus;
      root.querySelectorAll('[data-achievement-status]').forEach(button=>{
        button.classList.toggle('active',button===statusButton);
      });
      apply();
      return;
    }

    const categoryButton=event.target.closest('[data-achievement-category-filter]');
    if(categoryButton&&root.contains(categoryButton)){
      category=categoryButton.dataset.achievementCategoryFilter;
      root.querySelectorAll('[data-achievement-category-filter]').forEach(button=>{
        button.classList.toggle('active',button===categoryButton);
      });
      apply();
      return;
    }

    const toggle=event.target.closest('.achievement-complete-toggle');
    if(toggle&&root.contains(toggle)){
      const item=toggle.closest('[data-achievement-item]');
      if(!item)return;

      const set=getCompletedAchievements();
      const id=item.dataset.achievementId;
      const wasDone=set.has(id);

      if(wasDone)set.delete(id);
      else set.add(id);

      saveCompletedAchievements(set);

      item.classList.remove('is-completing','is-uncompleting');
      void item.offsetWidth;
      item.classList.add(wasDone?'is-uncompleting':'is-completing');

      window.clearTimeout(item._achievementAnimationTimer);
      const colorTransitionDuration=300;
      const animationDuration=620;
      const totalToggleDuration=colorTransitionDuration+animationDuration;

      // Keep the card visible while the existing completion/uncompletion animation plays.
      // In the completed/incomplete filters, only remove it after that animation finishes.
      if(status!=='all' && ((status==='completed' && !set.has(id)) || (status==='incomplete' && set.has(id)))){
        item._achievementAnimationTimer=window.setTimeout(()=>{
          item.classList.remove('is-completing','is-uncompleting');

          // After the existing check/uncheck animation, let the card leave gracefully.
          // The card first settles/fades, then its actual height collapses so the list
          // closes the gap naturally instead of jumping to display:none.
          const exitHeight=item.offsetHeight;
          item.style.height=`${exitHeight}px`;
          void item.offsetWidth;
          item.classList.add('is-filter-exiting');
          window.requestAnimationFrame(()=>{
            item.style.height='0px';
          });

          window.setTimeout(()=>{
            item.classList.remove('is-filter-exiting');
            item.style.height='';
            apply();
          },400);
        },totalToggleDuration);
      }else{
        item._achievementAnimationTimer=window.setTimeout(()=>{
          item.classList.remove('is-completing','is-uncompleting');
        },totalToggleDuration);
        apply();
      }
      return;
    }

    const main=event.target.closest('.achievement-item-main');
    if(main&&root.contains(main)){
      const item=main.closest('[data-achievement-item]');
      if(!item)return;
      const open=!item.classList.contains('expanded');
      item.classList.toggle('expanded',open);
      main.setAttribute('aria-expanded',String(open));
    }
  });

  root.addEventListener('keydown',event=>{
    if(event.key!=='Enter'&&event.key!==' ')return;
    const main=event.target.closest('.achievement-item-main');
    if(!main||!root.contains(main))return;
    event.preventDefault();
    const item=main.closest('[data-achievement-item]');
    if(!item)return;
    const open=!item.classList.contains('expanded');
    item.classList.toggle('expanded',open);
    main.setAttribute('aria-expanded',String(open));
  });

  apply();
}

:'查看剧情解读视频档案'}"><div class="video-thumb" aria-hidden="true"></div><div class="video-card-body"><div class="video-card-meta"><span class="record-type">${c.story}</span><span class="archive-status">${isEnglish?'ARCHIVED':'已归档'}</span></div><span class="record-date">2026.10.07</span><p>${isEnglish?'A structured analysis of the game\'s story, characters, events, and related archive materials.':'围绕游戏剧情、人物、事件以及相关档案资料进行整理与解读。'}</p></div></article></div></section></section>`;
  if(id==='article') return `<section class="article-page"><section class="page-panel glass article-category-panel"><div class="page-panel-head"><div><h3>${c.title}</h3><p>${c.intro}</p></div></div><div class="article-index" role="tablist" aria-label="${c.title}"><button class="article-index-item interactive active" type="button" role="tab" aria-selected="true" data-article-filter="all"><span class="article-index-title">${c.all}</span><span class="article-index-desc">${c.allDesc}</span></button><button class="article-index-item interactive" type="button" role="tab" aria-selected="false" data-article-filter="full"><span class="article-index-title">${c.full}</span><span class="article-index-desc">${c.fullDesc}</span></button><button class="article-index-item interactive" type="button" role="tab" aria-selected="false" data-article-filter="story"><span class="article-index-title">${c.story}</span><span class="article-index-desc">${c.storyDesc}</span></button></div></section><section class="page-panel glass article-content-panel"><div class="article-content-head"><h4>${isEnglish?'Article Records':'文章记录'}</h4></div><div class="article-list" data-article-content><article class="article-card interactive" data-article-type="story" data-article-detail="story" tabindex="0" role="button" aria-label="${isEnglish?'Open story analysis article':'查看剧情解读文章'}"><div class="video-thumb" aria-hidden="true"></div><div class="video-card-body"><div class="article-card-meta"><span class="record-type">${c.story}</span><span class="archive-status">${isEnglish?'ARCHIVED':'已归档'}</span></div><span class="record-date">2026.10.08</span><p>${c.articleDesc}</p></div></article><div class="empty article-filter-empty" data-article-empty style="display:none"><div><b>${isEnglish?'NO ARTICLE RECORDS':'暂无文章记录'}</b></div></div></div></section></section>`;
if(id==='achievements') return achievementMarkup();
  if(id==='map') return `<section class="page-panel glass map-panel"><div class="page-panel-head"><div><h3>${c.title}</h3><p>${c.intro}</p></div></div><div class="empty"><div><b>${c.empty}</b></div></div></section>`;
  if(id==='log') return `<section class="page-panel glass log-panel"><div class="page-panel-head"><div><h3>${c.title}</h3><p>${isEnglish?'ARCHIVE CHANGE RECORD':'档案变更记录'}</p></div></div><div class="log-list"><article class="log-item interactive" data-log-action="article" tabindex="0" role="button" aria-label="${isEnglish?'Open story analysis article archive':'打开剧情解读文章档案'}"><time class="log-date">2026.10.08</time><div class="log-body"><strong><span class="log-highlight">${isEnglish?'STORY ANALYSIS ARTICLE':'剧情解读文章'}</span> ${isEnglish?'ADDED TO ARCHIVE':'加入档案'}</strong></div><b class="log-status">${isEnglish?'COMPLETED':'已完成'}</b></article><article class="log-item interactive" data-log-action="story-video" tabindex="0" role="button" aria-label="${isEnglish?'Open story analysis video category':'打开剧情解读视频分类'}"><time class="log-date">2026.10.07</time><div class="log-body"><strong><span class="log-highlight">${isEnglish?'STORY ANALYSIS VIDEO':'剧情解读视频'}</span> ${isEnglish?'ADDED TO ARCHIVE':'加入档案'}</strong></div><b class="log-status">${isEnglish?'COMPLETED':'已完成'}</b></article><article class="log-item interactive" data-log-action="full-video" tabindex="0" role="button" aria-label="${isEnglish?'Open full playthrough video category':'打开全流程视频分类'}"><time class="log-date">2026.09.29</time><div class="log-body"><strong><span class="log-highlight">${isEnglish?'FULL PLAYTHROUGH VIDEO':'全流程视频'}</span> ${isEnglish?'ADDED TO ARCHIVE':'加入档案'}</strong></div><b class="log-status">${isEnglish?'COMPLETED':'已完成'}</b></article><article class="log-item interactive" data-log-action="home" tabindex="0" role="button" aria-label="${isEnglish?'Open archive home':'打开档案首页'}"><time class="log-date">2026.09.29</time><div class="log-body"><strong><span class="log-highlight">${isEnglish?'ARCHIVE CREATED':'档案建立'}</span></strong></div><b class="log-status">${isEnglish?'COMPLETED':'已完成'}</b></article></div></section>`;
  return '';
}

function triggerFeedback(element){
  if(!element) return;
  element.classList.remove('is-sweeping');
  void element.offsetWidth;
  element.classList.add('is-sweeping');
  window.clearTimeout(element._sweepTimer);
  element._sweepTimer=window.setTimeout(()=>element.classList.remove('is-sweeping'),760);
}

document.addEventListener('pointerdown',event=>{
  const el=event.target.closest('.interactive');
  if(el) el.classList.add('is-pressed');
});
document.addEventListener('pointerup',event=>{
  const el=event.target.closest('.interactive');
  if(el) el.classList.remove('is-pressed');
});
document.addEventListener('pointercancel',event=>{
  const el=event.target.closest('.interactive');
  if(el) el.classList.remove('is-pressed');
});
document.addEventListener('click',event=>{
  const el=event.target.closest('.interactive');
  if(el) triggerFeedback(el);
});

let currentView={section:'home',detail:null};
function setActive(id){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===id));}
function renderView(view,push=false){
  currentView={...view};
  const root=document.getElementById('contentRoot');
  root.innerHTML=view.section==='video'&&view.detail?videoDetailMarkup(view.detail):(view.section==='article'&&view.detail==='story-article'?articleDetailMarkup('story'):(view.section==='home'?homeMarkup():pageMarkup(view.section)));
  if(window.matchMedia('(min-width:761px)').matches){const scrollRoot=document.querySelector('.main-area'); if(scrollRoot) scrollRoot.scrollTo({top:0,behavior:'auto'});}else{window.scrollTo({top:0,behavior:'auto'});}
  setActive(view.section);
  updateStaticLanguage();
  updateBreadcrumb();
  bindVideoCategoryTabs();
  bindArticleCategoryTabs();
  bindAchievementFilters();
  bindLogLinks();
  if(push) history.pushState(view,'',location.href.split('#')[0]+'#'+encodeURIComponent(view.detail?view.section+'-'+view.detail:view.section));
}
function jumpTo(id){if(currentView.section===id&&!currentView.detail)return;renderView({section:id,detail:null},true);}
function bindLogLinks(){
  document.querySelectorAll('[data-log-action]').forEach(item=>{
    const go=()=>{
      const action=item.dataset.logAction;
      window.setTimeout(()=>{
        if(action==='home') jumpTo('home');
        else if(action==='full-video') openVideoCategory('full');
        else if(action==='story-video') openVideoCategory('story');
        else if(action==='article') openArticleCategory('story');
      },120);
    };
    item.addEventListener('click',go);
    item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}
function openVideoCategory(type){
  renderView({section:'video',detail:null},true);
  window.setTimeout(()=>{
    const tab=document.querySelector(`[data-video-filter="${type}"]`);
    if(tab) tab.click();
  },40);
}
function openArticleCategory(type){
  renderView({section:'article',detail:null},true);
  window.setTimeout(()=>{
    const tab=document.querySelector(`[data-article-filter="${type}"]`);
    if(tab) tab.click();
  },40);
}
function openVideoDetail(type='full'){
  if(type!=='full'&&type!=='story') return;
  const source=document.querySelector(`[data-video-detail="${type}"]`);
  if(source) triggerFeedback(source);
  window.setTimeout(()=>renderView({section:'video',detail:type},true),120);
}
function backToVideo(){renderView({section:'video',detail:null},true);}
function backToArticle(){renderView({section:'article',detail:null},true);}
function openArticleDetail(type='story'){const source=document.querySelector(`[data-article-detail="${type}"]`);if(source)triggerFeedback(source);window.setTimeout(()=>renderView({section:'article',detail:'story-article'},true),120);}
function toggleLanguage(){
  const button=document.getElementById('languageButton');
  if(button) triggerFeedback(button);
  isEnglish=!isEnglish;
  window.setTimeout(()=>renderView(currentView,false),40);
}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');}

document.addEventListener('click',event=>{
  const language=event.target.closest('#languageButton');
  if(language){ event.preventDefault(); toggleLanguage(); return; }
  const btn=event.target.closest('[data-detail-action="full"]');
  if(btn){
    event.preventDefault();
    triggerFeedback(btn);
    openVideoDetail('full');
    return;
  }
  const card=event.target.closest('[data-video-detail]');
  if(card && !event.target.closest('button')){
    event.preventDefault();
    openVideoDetail(card.dataset.videoDetail);
    return;
  }
  const related=event.target.closest('[data-related-video]');
  if(related){event.preventDefault();const type=related.dataset.relatedVideo;triggerFeedback(related);window.setTimeout(()=>openVideoDetail(type),100);return;}
  const articleDetail=event.target.closest('[data-article-detail]');
  if(articleDetail){event.preventDefault();openArticleDetail(articleDetail.dataset.articleDetail);return;}
  const backArticle=event.target.closest('[data-back-article]');
  if(backArticle){event.preventDefault();triggerFeedback(backArticle);window.setTimeout(backToArticle,100);return;}
  const storyVideo=event.target.closest('[data-story-video]');
  if(storyVideo){
    event.preventDefault();
    triggerFeedback(storyVideo);
    window.setTimeout(()=>openVideoCategory('story'),100);
    return;
  }
  const back=event.target.closest('[data-back-video]');
  if(back){
    event.preventDefault();
    triggerFeedback(back);
    window.setTimeout(backToVideo,100);
    return;
  }
});

document.addEventListener('keydown',event=>{
  if(event.key!=='Enter'&&event.key!==' ')return;
  const card=event.target.closest('[data-video-detail]');
  if(card){event.preventDefault();openVideoDetail(card.dataset.videoDetail);return;}
  const articleCard=event.target.closest('[data-article-detail]');
  if(articleCard){event.preventDefault();openArticleDetail(articleCard.dataset.articleDetail);}
});


window.addEventListener('popstate',event=>{if(event.state&&event.state.section)renderView(event.state,false);else renderView({section:'home',detail:null},false);});

updateStaticLanguage();
renderView({section:'home',detail:null},false);
// RE0 story article: navigate inside the archive's actual scroll container.
document.addEventListener('click',function(event){
  const tocLink=event.target.closest('.article-toc a[href^="#re0-chapter-"]');
  const returnButton=event.target.closest('[data-article-return-top]');
  if(!tocLink&&!returnButton)return;
  const scrollRoot=document.querySelector('.main-area');
  if(!scrollRoot)return;
  event.preventDefault();
  if(returnButton){
    scrollRoot.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  const target=document.querySelector(tocLink.getAttribute('href'));
  if(!target)return;
  const top=target.getBoundingClientRect().top-scrollRoot.getBoundingClientRect().top+scrollRoot.scrollTop-24;
  scrollRoot.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  if(history&&history.replaceState)history.replaceState(null,'',tocLink.getAttribute('href'));
});

</script>
</body>
